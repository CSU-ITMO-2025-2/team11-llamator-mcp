services:
  redis:
    image: redis:7.4-alpine
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  vllm:
    image: vllm/vllm-openai:v0.5.1
    platform: ${LLAMATOR_MCP_VLLM_PLATFORM:-linux/amd64}
    shm_size: "1g"
    ports:
      - "8080:80"
    environment:
      HF_HOME: /data/hf
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      # Указываем PyTorch, что нет доступных CUDA устройств
      CUDA_VISIBLE_DEVICES: ""
      # Принудительно выбираем attention backend, который не требует CUDA
      VLLM_ATTENTION_BACKEND: "FLASHINFER"
    volumes:
      - hf-cache:/data
    command:
      - "--model"
      - "${AUX_LLM_MODEL_ID:-microsoft/Phi-3-mini-4k-instruct}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "80"
      - "--max-model-len"
      - "${AUX_LLM_MAX_MODEL_LEN:-4096}"
      - "--device"
      - "${LLAMATOR_MCP_VLLM_DEVICE:-cpu}"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 120
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_started
      vllm:
        condition: service_healthy
    environment:
      LLAMATOR_MCP_REDIS_DSN: ${LLAMATOR_MCP_REDIS_DSN:-redis://redis:6379/0}
      LLAMATOR_MCP_ARTIFACTS_ROOT: ${LLAMATOR_MCP_ARTIFACTS_ROOT:-/data/artifacts}

      LLAMATOR_MCP_AUX_OPENAI_BASE_URL: ${LLAMATOR_MCP_AUX_OPENAI_BASE_URL:-http://vllm:80/v1}
      LLAMATOR_MCP_AUX_OPENAI_MODEL: ${LLAMATOR_MCP_AUX_OPENAI_MODEL:-vllm}
      LLAMATOR_MCP_AUX_OPENAI_API_KEY: ${LLAMATOR_MCP_AUX_OPENAI_API_KEY:-dummy}

      LLAMATOR_MCP_API_KEY: ${LLAMATOR_MCP_API_KEY:-}
      LLAMATOR_MCP_LOG_LEVEL: ${LLAMATOR_MCP_LOG_LEVEL:-INFO}

      LLAMATOR_MCP_JOB_TTL_SECONDS: ${LLAMATOR_MCP_JOB_TTL_SECONDS:-604800}
      LLAMATOR_MCP_RUN_TIMEOUT_SECONDS: ${LLAMATOR_MCP_RUN_TIMEOUT_SECONDS:-3600}
      LLAMATOR_MCP_REPORT_LANGUAGE: ${LLAMATOR_MCP_REPORT_LANGUAGE:-en}

      LLAMATOR_MCP_HTTP_HOST: ${LLAMATOR_MCP_HTTP_HOST:-0.0.0.0}
      LLAMATOR_MCP_HTTP_PORT: ${LLAMATOR_MCP_HTTP_PORT:-8000}
      LLAMATOR_MCP_UVICORN_LOG_LEVEL: ${LLAMATOR_MCP_UVICORN_LOG_LEVEL:-info}

      LLAMATOR_MCP_MCP_MOUNT_PATH: ${LLAMATOR_MCP_MCP_MOUNT_PATH:-/mcp}
      LLAMATOR_MCP_MCP_STREAMABLE_HTTP_PATH: ${LLAMATOR_MCP_MCP_STREAMABLE_HTTP_PATH:-/}
    volumes:
      - artifacts:/data/artifacts
    ports:
      - "${LLAMATOR_MCP_HTTP_PORT:-8000}:${LLAMATOR_MCP_HTTP_PORT:-8000}"
    command:
      [
        "uvicorn",
        "llamator_mcp_server.main:app",
        "--host",
        "${LLAMATOR_MCP_HTTP_HOST:-0.0.0.0}",
        "--port",
        "${LLAMATOR_MCP_HTTP_PORT:-8000}",
        "--log-level",
        "${LLAMATOR_MCP_UVICORN_LOG_LEVEL:-info}",
      ]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_started
      vllm:
        condition: service_healthy
    environment:
      LLAMATOR_MCP_REDIS_DSN: ${LLAMATOR_MCP_REDIS_DSN:-redis://redis:6379/0}
      LLAMATOR_MCP_ARTIFACTS_ROOT: ${LLAMATOR_MCP_ARTIFACTS_ROOT:-/data/artifacts}

      LLAMATOR_MCP_AUX_OPENAI_BASE_URL: ${LLAMATOR_MCP_AUX_OPENAI_BASE_URL:-http://vllm:80/v1}
      LLAMATOR_MCP_AUX_OPENAI_MODEL: ${LLAMATOR_MCP_AUX_OPENAI_MODEL:-vllm}
      LLAMATOR_MCP_AUX_OPENAI_API_KEY: ${LLAMATOR_MCP_AUX_OPENAI_API_KEY:-dummy}

      LLAMATOR_MCP_LOG_LEVEL: ${LLAMATOR_MCP_LOG_LEVEL:-INFO}

      LLAMATOR_MCP_JOB_TTL_SECONDS: ${LLAMATOR_MCP_JOB_TTL_SECONDS:-604800}
      LLAMATOR_MCP_RUN_TIMEOUT_SECONDS: ${LLAMATOR_MCP_RUN_TIMEOUT_SECONDS:-3600}
      LLAMATOR_MCP_REPORT_LANGUAGE: ${LLAMATOR_MCP_REPORT_LANGUAGE:-en}

      LLAMATOR_MCP_HTTP_HOST: ${LLAMATOR_MCP_HTTP_HOST:-0.0.0.0}
      LLAMATOR_MCP_HTTP_PORT: ${LLAMATOR_MCP_HTTP_PORT:-8000}
      LLAMATOR_MCP_UVICORN_LOG_LEVEL: ${LLAMATOR_MCP_UVICORN_LOG_LEVEL:-info}

      LLAMATOR_MCP_MCP_MOUNT_PATH: ${LLAMATOR_MCP_MCP_MOUNT_PATH:-/mcp}
      LLAMATOR_MCP_MCP_STREAMABLE_HTTP_PATH: ${LLAMATOR_MCP_MCP_STREAMABLE_HTTP_PATH:-/}
      LLAMATOR_MCP_API_KEY: ${LLAMATOR_MCP_API_KEY:-}
    volumes:
      - artifacts:/data/artifacts
    command: [ "arq", "llamator_mcp_server.worker_settings.WorkerSettings" ]

volumes:
  redis-data:
  hf-cache:
  artifacts: